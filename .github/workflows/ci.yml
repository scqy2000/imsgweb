name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Check agent documentation consistency
        run: cmp AGENTS.md CLAUDE.md

      - run: bunx prettier --check .
      - run: bun run check
      - run: bun run lint
      - run: bun test

      - name: Install imsg
        run: brew install steipete/tap/imsg

      - name: Build with embedded imsg
        run: IMSGWEB_EMBED_IMSG="$(brew --prefix imsg)/libexec/imsg" bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: imsgweb
          path: dist/imsgweb
          if-no-files-found: error
